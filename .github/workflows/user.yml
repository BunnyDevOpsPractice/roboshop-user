name: user
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  ci:
    uses: bunnyrdy/ArgoCD_Project/.github/workflows/ci.yml@main
    with:
      language: node
      component: user
      deploy: false          # so it bumps gitops; faithful ci.yml defaults this to false
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
